name: Check Fire Deals (HTML)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Restore seen fire deals
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: fire-deals-seen
          path: ./
          search-current-run: false

      - name: Check for fire deals
        run: python3 scripts/check_fire_deals.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ROLE_ID: ${{ secrets.DISCORD_ROLE_ID }}

      - name: Persist seen fire deals
        uses: actions/upload-artifact@v4
        with:
          name: fire-deals-seen
          path: fire_deals_seen.json
          retention-days: 7
          overwrite: true

      - name: Notify on consecutive failures
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(gh run list --workflow "${{ github.workflow }}" --branch "${{ github.ref_name }}" \
            --status completed --json conclusion --limit 1 --jq '.[0].conclusion')
          if [ "$prev" = "failure" ]; then
            curl -s -H "Content-Type: application/json" \
              -X POST \
              -d '{"content":"🔴 2 consecutive failures: **${{ github.workflow }}**\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}>"}' \
              ${{ secrets.DISCORD_WEBHOOK_URL }}
          fi
