name: Check Slickdeals Deals (RSS)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Restore seen GUIDs
        uses: actions/cache@v4
        with:
          path: seen_guids.json
          key: seen-guids-${{ github.run_id }}
          restore-keys: |
            seen-guids-

      - name: Debug restore
        run: |
          if [ -f seen_guids.json ]; then
            echo "Restored seen_guids.json with $(python3 -c 'import json; print(len(json.load(open(\"seen_guids.json\"))))') GUIDs"
          else
            echo "No seen_guids.json — starting fresh"
          fi

      - name: Check for deals
        working-directory: scripts
        run: python3 check_deals.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ROLE_ID: ${{ secrets.DISCORD_ROLE_ID }}

      - name: Notify on consecutive failures
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(gh run list --workflow "${{ github.workflow }}" --branch "${{ github.ref_name }}" \
            --status completed --json conclusion --limit 1 --jq '.[0].conclusion')
          if [ "$prev" = "failure" ]; then
            curl -s -H "Content-Type: application/json" \
              -X POST \
              -d '{"content":"🔴 2 consecutive failures: **${{ github.workflow }}**\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}>"}' \
              ${{ secrets.DISCORD_WEBHOOK_URL }}
          fi
